name: Bug report
description: Something in the pipeline or the UI doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the audio format, length and language if relevant. Please don't attach recordings containing personal data.
  - type: input
    id: env
    attributes:
      label: Environment
      description: Node version, OS, and whether this is local (`npm run dev`) or deployed.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      render: text
