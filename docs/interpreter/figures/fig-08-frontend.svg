<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="Frontend component tree: the shared layout wraps the server-rendered interpreter page, whose client component owns all state and renders two hold buttons, two incoming blocks and the pipeline output panel; only the client calls the API." class="sketch" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<style>/* standalone viewing only — stripped when the figure is inlined into a page */
svg{color:#17202b} .sk-bg{fill:#ffffff} .sk-fill{fill:#e3f2ef} .sk-accent{stroke:#0f766e} text.sk-accent{fill:#0f766e;stroke:none}
@media (prefers-color-scheme:dark){svg{color:#e4e9ef} .sk-bg{fill:#161d25} .sk-fill{fill:#15302d} .sk-accent{stroke:#4fd1c0} text.sk-accent{fill:#4fd1c0}}
</style>
<defs>
<filter id="rough" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="10" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="sk-accent" d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
</defs>
<g filter="url(#rough)">
  <rect x="280" y="20" width="220" height="48" rx="6"/>
  <rect x="280" y="104" width="220" height="48" rx="6"/>
  <rect class="sk-fill" x="280" y="188" width="220" height="48" rx="6" stroke="none"/>
  <rect class="sk-accent" x="280" y="188" width="220" height="48" rx="6"/>
  <rect x="20" y="270" width="160" height="44" rx="6"/>
  <rect x="210" y="270" width="160" height="44" rx="6"/>
  <rect x="400" y="270" width="170" height="44" rx="6"/>
  <rect x="656" y="180" width="150" height="64" rx="6"/>
  <rect x="660" y="184" width="142" height="56" rx="4"/>
  <path d="M390 68 L390 102" marker-end="url(#arrow)"/>
  <path d="M390 152 L390 186" marker-end="url(#arrow)"/>
  <path d="M330 236 L100 268" marker-end="url(#arrow)"/>
  <path d="M370 236 L290 268" marker-end="url(#arrow)"/>
  <path d="M430 236 L485 268" marker-end="url(#arrow)"/>
  <path d="M502 212 L652 212" class="sk-accent" marker-end="url(#arrow-accent)"/>
</g>
<g fill="currentColor" stroke="none">
  <text x="390.0" y="41.0" text-anchor="middle">RootLayout</text>
  <text x="390.0" y="57.0" text-anchor="middle" font-size="11.5">Masthead · DemoFooter · theme</text>
  <text x="390.0" y="125.0" text-anchor="middle">interpreter/page.tsx</text>
  <text x="390.0" y="141.0" text-anchor="middle" font-size="11.5">server · metadata · intro</text>
  <text x="390.0" y="209.0" text-anchor="middle" class="sk-accent">InterpreterClient</text>
  <text x="390.0" y="225.0" text-anchor="middle" font-size="11.5">status · lastTurn · history</text>
  <text x="100.0" y="289.0" text-anchor="middle">HoldButton ×2</text>
  <text x="100.0" y="305.0" text-anchor="middle" font-size="11.5">pointer down / up</text>
  <text x="290.0" y="289.0" text-anchor="middle">IncomingBlock ×2</text>
  <text x="290.0" y="305.0" text-anchor="middle" font-size="11.5">they said · you hear</text>
  <text x="485.0" y="289.0" text-anchor="middle">Pipeline output</text>
  <text x="485.0" y="305.0" text-anchor="middle" font-size="11.5">&lt;audio&gt; · turn list</text>
  <text x="731.0" y="209.0" text-anchor="middle">POST /api/</text>
  <text x="731.0" y="225.0" text-anchor="middle" font-size="11.5">interpreter/translate</text>
  <rect class="sk-bg" x="506" y="194" width="142" height="17" rx="3"/>
  <text x="577.0" y="206" text-anchor="middle" font-size="12" class="sk-accent">uploadAndTranslate()</text>
</g>
</svg>
