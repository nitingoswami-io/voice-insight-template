<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Sequence: one hop. The caller holds the button and speaks; on release the client posts the recording; the route calls Whisper with the source language, GPT-4o-mini to translate, and ElevenLabs to speak, then returns one JSON body that the client plays on the other side." class="sketch" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
