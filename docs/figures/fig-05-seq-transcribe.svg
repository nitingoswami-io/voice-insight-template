<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-label="Sequence: the browser sends the audio to /api/transcribe, which relays it to AssemblyAI and starts a job with language detection and speaker labels; the browser then polls /api/status every three seconds until the transcript is ready." class="sketch" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<style>/* standalone viewing only — stripped when the figure is inlined into a page */
svg{color:#17202b} .sk-bg{fill:#ffffff} .sk-fill{fill:#e3f2ef} .sk-accent{stroke:#0f766e} text.sk-accent{fill:#0f766e;stroke:none}
@media (prefers-color-scheme:dark){svg{color:#e4e9ef} .sk-bg{fill:#161d25} .sk-fill{fill:#15302d} .sk-accent{stroke:#4fd1c0} text.sk-accent{fill:#4fd1c0}}
</style>
<defs>
<filter id="rough" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="6" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="sk-accent" d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
</defs>
<g filter="url(#rough)">
  <circle cx="60" cy="19" r="9"/>
  <path d="M60 28 V54 M45 38 H75 M60 54 L48 72 M60 54 L72 72"/>
  <path d="M60 96 V520" stroke-dasharray="3 6" stroke-width="1"/>
  <rect x="158.0" y="24" width="84" height="34" rx="6"/>
  <path d="M200 58 V520" stroke-dasharray="3 6" stroke-width="1"/>
  <rect x="298.0" y="24" width="124" height="34" rx="6"/>
  <path d="M360 58 V520" stroke-dasharray="3 6" stroke-width="1"/>
  <rect x="471.0" y="24" width="98" height="34" rx="6"/>
