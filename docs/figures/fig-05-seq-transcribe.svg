  <path d="M64 118 L196 118" marker-end="url(#arrow)"/>
  <path d="M200 144 L226 144 L226 156 L203 156" marker-end="url(#arrow)"/>
  <path d="M204 184 L356 184" marker-end="url(#arrow)"/>
  <path d="M360 210 L386 210 L386 222 L363 222" marker-end="url(#arrow)"/>
  <path d="M364 250 L676 250" class="sk-accent" marker-end="url(#arrow-accent)"/>
  <path d="M676 280 L364 280" class="sk-accent" stroke-dasharray="6 5" marker-end="url(#arrow-accent)"/>
  <path d="M364 310 L676 310" class="sk-accent" marker-end="url(#arrow-accent)"/>
  <path d="M676 340 L364 340" class="sk-accent" stroke-dasharray="6 5" marker-end="url(#arrow-accent)"/>
  <path d="M356 370 L204 370" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
