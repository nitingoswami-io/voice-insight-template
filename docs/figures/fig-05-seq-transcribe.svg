  <path d="M676 494 L524 494" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M516 524 L204 524" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
</g>
<g fill="currentColor" stroke="none">
  <text x="60" y="90" text-anchor="middle">Visitor</text>
  <text x="200.0" y="46.0" text-anchor="middle">Analyzer</text>
  <text x="360.0" y="46.0" text-anchor="middle">/api/transcribe</text>
  <text x="520.0" y="46.0" text-anchor="middle">/api/status</text>
  <text x="680.0" y="46.0" text-anchor="middle">AssemblyAI</text>
  <rect class="sk-bg" x="59" y="99" width="142" height="17" rx="3"/>
  <text x="130.0" y="111" text-anchor="middle" font-size="12">1  choose audio file</text>
  <text x="234" y="154" text-anchor="start" font-size="12">2  size ≤ maxBytes?</text>
  <rect class="sk-bg" x="212" y="165" width="135" height="17" rx="3"/>
  <text x="280.0" y="177" text-anchor="middle" font-size="12">3  POST audio bytes</text>
  <text x="394" y="220" text-anchor="start" font-size="12">4  cap check (cookie)</text>
  <rect class="sk-bg" x="456" y="231" width="129" height="17" rx="3"/>
  <text x="520.0" y="243" text-anchor="middle" class="sk-accent" font-size="12">5  POST /v2/upload</text>
  <rect class="sk-bg" x="472" y="261" width="95" height="17" rx="3"/>
  <text x="520.0" y="273" text-anchor="middle" class="sk-accent" font-size="12">6  upload_url</text>
  <rect class="sk-bg" x="442" y="291" width="155" height="17" rx="3"/>
  <text x="520.0" y="303" text-anchor="middle" class="sk-accent" font-size="12">7  POST /v2/transcript</text>
  <rect class="sk-bg" x="486" y="321" width="68" height="17" rx="3"/>
  <text x="520.0" y="333" text-anchor="middle" class="sk-accent" font-size="12">8  job id</text>
  <rect class="sk-bg" x="246" y="351" width="68" height="17" rx="3"/>
  <text x="280.0" y="363" text-anchor="middle" font-size="12">9  { id }</text>
  <text x="148" y="411" text-anchor="start" font-size="11.5" font-weight="700">loop · every 3 s until ready</text>
  <rect class="sk-bg" x="316" y="415" width="88" height="17" rx="3"/>
  <text x="360.0" y="427" text-anchor="middle" font-size="12">10  GET ?id=</text>
  <rect class="sk-bg" x="512" y="445" width="176" height="17" rx="3"/>
  <text x="600.0" y="457" text-anchor="middle" font-size="12">11  GET /v2/transcript/id</text>
  <rect class="sk-bg" x="562" y="475" width="75" height="17" rx="3"/>
  <text x="600.0" y="487" text-anchor="middle" font-size="12">12  status</text>
  <rect class="sk-bg" x="292" y="505" width="135" height="17" rx="3"/>
  <text x="360.0" y="517" text-anchor="middle" font-size="12">13  working | ready</text>
</g>
</svg>
