<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="Use case diagram: a visitor analyses a call, inspects the evidence behind each claim, views a free sample, or unlocks larger uploads with an access code. Analysing a call uses the AssemblyAI and xAI APIs." class="sketch" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<style>/* standalone viewing only — stripped when the figure is inlined into a page */
