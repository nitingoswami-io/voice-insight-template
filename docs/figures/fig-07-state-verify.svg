<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="State diagram: each quote the model returns must be found in the transcript, sit within five seconds of its claimed time, and belong to the claimed speaker; any failure drops the claim and records why." class="sketch" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<style>/* standalone viewing only — stripped when the figure is inlined into a page */
svg{color:#17202b} .sk-bg{fill:#ffffff} .sk-fill{fill:#e3f2ef} .sk-accent{stroke:#0f766e} text.sk-accent{fill:#0f766e;stroke:none}
@media (prefers-color-scheme:dark){svg{color:#e4e9ef} .sk-bg{fill:#161d25} .sk-fill{fill:#15302d} .sk-accent{stroke:#4fd1c0} text.sk-accent{fill:#4fd1c0}}
</style>
<defs>
<filter id="rough" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="8" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="sk-accent" d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4"/></marker>
</defs>
<g filter="url(#rough)">
  <rect x="60" y="66" width="150" height="48" rx="18"/>
  <rect x="270" y="66" width="150" height="48" rx="18"/>
  <rect x="480" y="66" width="150" height="48" rx="18"/>
  <rect x="690" y="66" width="190" height="48" rx="18" class="sk-accent"/>
  <rect x="300" y="220" width="300" height="48" rx="18"/>
  <path d="M36 90 L60 90" class="sk-accent" marker-end="url(#arrow-accent)"/>
  <path d="M210 90 L270 90" class="sk-accent" marker-end="url(#arrow-accent)"/>
  <path d="M420 90 L480 90" class="sk-accent" marker-end="url(#arrow-accent)"/>
  <path d="M630 90 L690 90" class="sk-accent" marker-end="url(#arrow-accent)"/>
  <path d="M135 114 V244 H300" marker-end="url(#arrow)"/>
  <path d="M345 114 L380 220" marker-end="url(#arrow)"/>
  <path d="M555 114 L520 220" marker-end="url(#arrow)"/>
</g>
<g fill="currentColor" stroke="none">
  <circle cx="30" cy="90" r="6"/>
  <text x="135.0" y="87.0" text-anchor="middle">Locate quote</text>
  <text x="135.0" y="103.0" text-anchor="middle" font-size="11">fuzzy match ≥ 0.85</text>
  <text x="345.0" y="87.0" text-anchor="middle">Check time</text>
  <text x="345.0" y="103.0" text-anchor="middle" font-size="11">nearest within ±5 s</text>
  <text x="555.0" y="87.0" text-anchor="middle">Check speaker</text>
  <text x="555.0" y="103.0" text-anchor="middle" font-size="11">diarized label</text>
  <text x="785.0" y="87.0" text-anchor="middle" class="sk-accent">Kept</text>
  <text x="785.0" y="103.0" text-anchor="middle" font-size="11">snapped to real timings</text>
  <text x="450.0" y="241.0" text-anchor="middle">Dropped and counted</text>
  <text x="450.0" y="257.0" text-anchor="middle" font-size="11">reason shown under Provenance</text>
  <rect class="sk-bg" x="219" y="70" width="42" height="17" rx="3"/>
  <text x="240" y="82" text-anchor="middle" class="sk-accent" font-size="12">found</text>
  <rect class="sk-bg" x="422" y="70" width="55" height="17" rx="3"/>
  <text x="450" y="82" text-anchor="middle" class="sk-accent" font-size="12">on time</text>
  <rect class="sk-bg" x="639" y="70" width="42" height="17" rx="3"/>
  <text x="660" y="82" text-anchor="middle" class="sk-accent" font-size="12">match</text>
  <rect class="sk-bg" x="116" y="168" width="108" height="17" rx="3"/>
  <text x="170" y="180" text-anchor="middle" font-size="12">quote_not_found</text>
  <rect class="sk-bg" x="298" y="156" width="129" height="17" rx="3"/>
  <text x="362" y="168" text-anchor="middle" font-size="12">timestamp_mismatch</text>
  <rect class="sk-bg" x="508" y="156" width="115" height="17" rx="3"/>
  <text x="565" y="168" text-anchor="middle" font-size="12">speaker_mismatch</text>
</g>
</svg>
