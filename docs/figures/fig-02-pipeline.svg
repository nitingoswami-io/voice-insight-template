<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 490" role="img" aria-label="Pipeline: a call recording is transcribed by AssemblyAI into words with speakers and timings; a prompt built from the rubric, the rules and the transcript goes to the LLM, which returns claims with quotes; the verifier checks every quote against the transcript's word stream and keeps only grounded claims; deterministic metrics are computed from the same words with no model; the results page shows both and plays the original audio from the browser." class="sketch" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<style>/* standalone viewing only — stripped when the figure is inlined into a page */
svg{color:#17202b} .sk-bg{fill:#ffffff} .sk-fill{fill:#e3f2ef} .sk-accent{stroke:#0f766e} text.sk-accent{fill:#0f766e;stroke:none}
