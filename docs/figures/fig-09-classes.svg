  <text x="658" y="144" text-anchor="middle" font-size="12">checks</text>
  <text x="890.0" y="219" text-anchor="middle" font-weight="700">metrics.ts</text>
  <text x="810" y="245" text-anchor="start" font-size="11.5">+computeMetrics()</text>
  <text x="810" y="263" text-anchor="start" font-size="11.5">+guessAgentSpeaker()</text>
